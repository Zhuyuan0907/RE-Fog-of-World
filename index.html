<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fog of World Web</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map" aria-label="OpenStreetMap 地圖"></div>
    <div class="map-ui">
      <div class="button-row">
        <button id="locateBtn" type="button">定位</button>
        <button id="trackBtn" type="button">開始追蹤</button>
      </div>
      <div class="button-row">
        <button id="importBtn" type="button">匯入 GPX/KML</button>
        <button id="syncBtn" type="button">匯入 Sync</button>
        <button id="clearBtn" type="button">清除紀錄</button>
      </div>
      <div class="offset-panel" aria-label="Sync 位置校正">
        <div class="offset-header">
          <span>Sync 校正</span>
          <button id="offsetResetBtn" type="button">重設</button>
        </div>
        <p id="offsetValue" class="offset-value">blockX 0 / blockY 0</p>
        <div class="offset-grid">
          <span></span>
          <button id="offsetNorthBtn" type="button" aria-label="往北微調">↑</button>
          <span></span>
          <button id="offsetWestBtn" type="button" aria-label="往西微調">←</button>
          <button id="offsetCenterBtn" type="button" aria-label="回到預設校正">●</button>
          <button id="offsetEastBtn" type="button" aria-label="往東微調">→</button>
          <span></span>
          <button id="offsetSouthBtn" type="button" aria-label="往南微調">↓</button>
          <span></span>
        </div>
      </div>
      <p id="status" class="status">地圖初始化中...</p>
    </div>
    <input id="fileInput" type="file" accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml" hidden />
    <input id="syncInput" type="file" webkitdirectory directory multiple hidden />

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
    <script src="./app.js"></script>
  </body>
</html>
